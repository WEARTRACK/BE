spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver # MySQL JDBC 드라이버 클래스입니다.
    url: ${DB_URL} # 예시: jdbc:mysql://localhost:3306/weartrack
    username: ${DB_USER} # MySQL 사용자명입니다.
    password: ${DB_PW} # MySQL 비밀번호입니다.

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    database: mysql # 사용하는 데이터베이스 타입입니다.
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false # 실행된 SQL을 콘솔에 출력합니다.
    hibernate:
      ddl-auto: update # 애플리케이션 실행 시 스키마를 반영합니다.
    properties:
      hibernate:
        format_sql: true # SQL 로그를 보기 좋게 정렬합니다.

# JWT 설정은 실행 환경의 환경변수에서 주입합니다.
jwt:
  secret: ${JWT_SECRET}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://wear-track.com,https://weartrack.co.kr}
  oauth:
    state-ttl-seconds: ${APP_OAUTH_STATE_TTL_SECONDS:300}
    mobile:
      callback-base-uri: ${APP_OAUTH_MOBILE_CALLBACK_BASE_URI:weartrack://auth/callback}
      handoff-ttl-seconds: ${APP_OAUTH_MOBILE_HANDOFF_TTL_SECONDS:180}

# OAuth 클라이언트 설정은 실행 환경의 환경변수에서 주입합니다.
oauth:
  client:
    connect-timeout-seconds: ${OAUTH_CLIENT_CONNECT_TIMEOUT_SECONDS:3}
    read-timeout-seconds: ${OAUTH_CLIENT_READ_TIMEOUT_SECONDS:5}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI}
    scope: ${GOOGLE_AUTH_SCOPE:openid email profile}
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    scope: ${KAKAO_AUTH_SCOPE:account_email}
  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    redirect-uri: ${NAVER_REDIRECT_URI}
    scope: ${NAVER_AUTH_SCOPE:name email}

file:
  upload-dir: uploads

cloud:
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${AWS_S3_BUCKET}
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}

ai:
  base-url: ${AI_BASE_URL}
  closet-base-url: ${AI_CLOSET_BASE_URL}

firebase:
  enabled: ${FIREBASE_ENABLED:false}

notification:
  time-zone: Asia/Seoul
  daily-review:
    cron: ${DAILY_REVIEW_NOTIFICATION_CRON:0 0 20 * * *}
  weekly-fashion-report:
    cron: ${WEEKLY_FASHION_REPORT_NOTIFICATION_CRON:0 0 21 * * SUN}
  long-unworn-clothes:
    cron: ${LONG_UNWORN_CLOTHES_NOTIFICATION_CRON:0 0 20 1 * *}

logging:
  level:
    root: INFO
    # Weartrack 내부 비즈니스 로직 로그는 상세하게 확인
    com.weartrack: DEBUG

    # 커스텀 예외 처리기에서 발생하는 NoResourceFoundException 관련 WARN 로그 숨기기
    com.weartrack.backend.global.exception.GlobalExceptionHandler: ERROR
    # Spring MVC 내부 예외 처리기에서 발생하는 WARN 로그 숨기기
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR

  file:
    # 서버 에러 추적을 위해 로그를 파일로 저장
    name: ./logs/weartrack-application.log
  logback:
    rollingpolicy:
      max-history: 30 # 최대 30일치 로그 보관
      max-file-size: 10MB # 파일 하나당 최대 10MB 유지

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      # 프로메테우스 수집 시 구분할 서버 고유 이름표 설정zh
      application: weartrack-spring-boot
