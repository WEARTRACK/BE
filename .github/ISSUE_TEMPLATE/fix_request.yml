name: "🐛 버그 리포트"
description: "발생한 버그를 상세하게 제보해 주세요."
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: bug-description
    attributes:
      label: "❗ 버그 설명"
      description: "어떤 문제가 발생했는지 설명해 주세요."
    validations:
      required: true
      
  - type: textarea
    id: reproduce
    attributes:
      label: "🔁 재현 방법 (Given-When-Then)"
      description: "어떤 상황(Given)에서 어떤 행동(When)을 했을 때 버그가 발생하는지(Then) 적어주세요."
      value: |
        **Given**
        - 
        
        **When**
        - 
        
        **Then**
        - 
    validations:
      required: true
      
  - type: textarea
    id: expected
    attributes:
      label: "🤔 기대한 동작"
      description: "원래는 어떻게 동작해야 정상인가요?"
    validations:
      required: true
      
  - type: textarea
    id: actual
    attributes:
      label: "🐞 실제 동작"
      description: "현재 비정상적으로 동작하는 상태를 적어주세요."
    validations:
      required: true
      
  - type: textarea
    id: environment
    attributes:
      label: "🖥 환경 정보"
      value: |
        - Spring Boot: 
        - JDK: 
        - DB: 
        - OS: 
    validations:
      required: true
      
  - type: textarea
    id: logs
    attributes:
      label: "📸 에러 로그 or 캡처 (선택)"
      description: "필요 시 에러 로그 일부 또는 화면 캡처를 첨부해 주세요."
    validations:
      required: false
